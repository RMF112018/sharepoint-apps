name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: 'pnpm'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - name: Install
        run: pnpm install --frozen-lockfile=false
      - name: Lint all
        run: pnpm -r lint
      - name: Test libraries
        run: pnpm --filter ./libs/... test
      - name: Test apps
        run: pnpm --filter ./apps/... test
      - name: Build libraries
        run: pnpm --filter ./libs/... build
      - name: Package apps (.sppkg)
        run: |
          set -e
          for app in $(ls -d apps/*/); do
            echo "Packaging $app"
            (cd "$app" && pnpm run package || true)
          done
      - name: Upload .sppkg artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sppkg-artifacts
          path: |
            apps/**/sharepoint/solution/*.sppkg
            apps/**/solution/*.sppkg



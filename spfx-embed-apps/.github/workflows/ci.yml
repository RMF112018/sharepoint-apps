name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: 'pnpm'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - name: Install
        run: pnpm install --frozen-lockfile=false
      - name: Lint
        run: pnpm -r lint || true
      - name: Type check (libs)
        run: pnpm --filter ./libs/... build
      - name: Build apps (no package restore)
        run: pnpm --filter ./apps/... build || true


